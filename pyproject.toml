[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "velum-forge"
version = "1.2.0"
description = "Velum Forge — AI-Driven B-Rep CAD, Blender 5.2+ Cycles PBR Baking, 4-Tier LOD & Game Asset Studio"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Velumix", url = "https://github.com/velumix" }
]
dependencies = [
    "build123d",
    "trimesh",
    "pymeshlab",
    "pillow",
    "numpy",
]

[project.scripts]
vforge = "velum_forge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["velum_forge"]
